<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef2f8">
  <meta name="description" content="Create a room and play Sardines with friends.">
  <title>Sardines</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='85'%3E🐟%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <header class="site-header card">
    <span class="wordmark">sardines</span>
    <button class="room-code" id="header-code" data-action="copy" hidden></button>
    <button class="text-button" id="how-button">How to play</button>
  </header>
  <main id="app"></main>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div id="dialog-content"></div>
    <button id="dialog-close" class="button secondary">Got it</button>
  </dialog>
</body>
</html>
